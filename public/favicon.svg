<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512">
  <defs>
    <clipPath id="clip-fav"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="#0066cc"/>
  <g clip-path="url(#clip-fav)">
    <g fill="#ffffff">
      <!-- 頭(突き上げた拳の方へ少し傾ける) -->
      <ellipse cx="240" cy="168" rx="55" ry="62" transform="rotate(6 240 168)"/>
      <!-- 首 -->
      <path d="M 214 212 L 270 212 L 264 256 L 220 256 Z"/>
      <!-- 胴体 -->
      <path d="M 158 286
               Q 160 264 186 256
               L 300 256
               Q 328 264 332 288
               L 338 512 L 166 512 Z"/>
      <!-- 右腕(突き上げ) -->
      <path d="M 312 278 Q 380 262 402 216" fill="none" stroke="#ffffff" stroke-width="54" stroke-linecap="round"/>
      <path d="M 402 216 L 390 122" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round"/>
      <circle cx="388" cy="104" r="40"/>
      <circle cx="355" cy="120" r="15"/>
      <!-- 左腕(拳を腰の横で握る) -->
      <path d="M 176 280 Q 118 306 106 358" fill="none" stroke="#ffffff" stroke-width="50" stroke-linecap="round"/>
      <path d="M 106 358 L 116 390" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round"/>
      <!-- 気合いの放射線 -->
      <g stroke="#ffffff" stroke-width="17" stroke-linecap="round" fill="none">
        <line x1="322" y1="58" x2="302" y2="30"/>
        <line x1="386" y1="44" x2="386" y2="12"/>
        <line x1="448" y1="60" x2="464" y2="36"/>
      </g>
    </g>
    <!-- 左の拳は胴体と重なるため、背景色の下敷きで分離してから描く -->
    <circle cx="136" cy="420" r="46" fill="#0066cc"/>
    <g fill="#ffffff">
      <circle cx="136" cy="420" r="36"/>
      <circle cx="170" cy="406" r="14"/>
    </g>
  </g>
</svg>